# A2A demo profiles.
#
# Hospitality is a profile, not code. The rail/EDI knowledge agent and the
# hotel knowledge agent are the same a2a_agent code path pointed at a
# different corpus, collection, and sample question via DEMO_PROFILE. Adding
# a third vertical means adding a block here, not writing new agent logic.
#
# A profile may also carry `ignore` (extra INTERCHANGE_IGNORE patterns for
# corpus discovery), `golden` (the eval set backing it), a `persona` (the
# system voice the answering agent adopts), a `retrieval` block (`mode`, and an
# optional `rerank` backend), and a `tools` list (a subset of search_docs /
# lookup_segment; the default keeps both).
#
# This file is the committed, public baseline. A private, uncommitted overlay
# at $INTERCHANGE_PROFILES (default ~/.interchange/profiles.yaml; empty string
# disables it) is merged on top — per named profile, its keys replace the
# committed ones (lists replace whole, never concatenate), and a name absent
# here is added entire. See a2a_agent/profiles.py (ADR-0016).

rail:
  collection: edi
  docs_dir: docs
  golden: eval/golden.jsonl
  sample_question: "What is a 997 and when is it sent?"
  examples:
    - "What is a 997 and when is it sent?"
    - "What is an 824 application advice?"
    - "How does an ISA envelope differ from a GS functional group?"
  knowledge_agent_name: interchange-knowledge (rail)
  requester_name: interchange-requester (rail)
  description: >
    Answers questions about X12/EDI transaction sets and rail trading-partner
    integration, grounded in this repo's docs/ corpus.

hotel:
  collection: hotel
  docs_dir: hotel-demo
  sample_question: "Can a guest get a late checkout at 2 pm, and is there a fee?"
  examples:
    - "Can a guest get a late checkout at 2 pm, and is there a fee?"
    - "What is the cancellation policy for a non-refundable rate?"
    - "Are pets allowed, and what is the pet fee?"
  tools: [search_docs]
  persona: >
    You are Interchange, an assistant for a fictional Demo Hotel's guest
    policies. Answer only from the provided policy excerpts and cite the source
    file in [brackets].
  knowledge_agent_name: interchange-knowledge (hotel)
  requester_name: interchange-requester (hotel)
  description: >
    Answers questions about a fictional Demo Hotel's cancellation, late
    checkout, and pet policies, grounded in the self-authored hotel-demo/
    corpus.

vault:
  collection: vault
  docs_dir: ${INTERCHANGE_VAULT_DIR}
  ignore:
    - "<secret-note>.md"
    - "00-INBOX/"
    - "05-DAILY/"
    - "03-RESOURCES/last30days-research/"
    - "03-RESOURCES/Templates/"
    - "scripts/"
  golden: eval/golden-vault.jsonl
  retrieval:
    mode: hybrid+rerank
  tools: [search_docs]
  persona: >
    You are an assistant over a personal Obsidian vault indexed read-only.
    Answer only from the provided notes, cite the note path in [brackets], and
    say plainly when the notes do not cover the question.
  sample_question: "How many tags should a single document normally carry?"
  examples:
    - "How many tags should a single document normally carry?"
    - "What does the PARA layout organise notes into?"
    - "Where do fleeting notes live before they are processed?"
  knowledge_agent_name: interchange-knowledge (vault)
  requester_name: interchange-requester (vault)
  description: >
    Answers questions over a personal Obsidian vault (PARA layout) indexed
    read-only into a local collection; the vault itself is never written.
